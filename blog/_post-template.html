<!DOCTYPE html>
<!--
  NEW POST CHECKLIST
  1. Save a copy of this file with a new name, e.g. my-new-post.html (keep it inside the blog folder)
  2. Change the <title>, the description, and the big title (h1) below
  3. Replace the content inside <article>
  4. Add ONE line to posts.js:  { title: "YOUR POST TITLE", url: "my-new-post.html" },
-->
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../logo-ico.png">
  <title>YOUR POST TITLE • Hem Works Blog</title>
  <meta name="description" content="One-sentence summary of your post.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Quicksand:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Quicksand', 'Nunito', 'sans-serif'],
            rounded: ['Quicksand', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Quicksand', 'Nunito', sans-serif;
      color: #230d4e;
      background-color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    .brand-logo-frame {
      width: 46px; height: 46px; border-radius: 12px; overflow: hidden;
      display: flex; align-items: flex-start; justify-content: center;
      background-color: transparent; flex-shrink: 0;
    }
    .brand-logo-frame img {
      width: 100%; height: auto; object-fit: cover; object-position: top center;
      transform: translateY(-0.5%);
    }
    /* Blog images: soft lilac frame so a missing image still looks tidy */
    .post-figure img {
      display: block; width: 100%; height: auto; background-color: #faf5ff;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-purple-200 selection:text-purple-900 font-sans">

  <!-- Navigation Bar (same as home page; links point back up one folder) -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-purple-100 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

      <a href="../index.html" class="flex items-center gap-3">
        <div class="brand-logo-frame">
          <img src="../H_W_LOGO.png" alt="Hem Works Logo" onerror="this.onerror=null; this.src='/small logo.png';">
        </div>
        <div class="flex items-center text-2xl sm:text-[1.75rem] font-black tracking-tight select-none">
          <span class="text-[#230d4e]">Hem</span>
          <span class="text-[#851ee8] mx-1.5 text-base"><i class="fa-solid fa-heart"></i></span>
          <span class="text-[#851ee8]">Works</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center space-x-9 text-base font-bold text-[#230d4e]">
        <a href="../index.html#how-it-works" class="hover:text-[#851ee8] transition-colors">How It Works</a>
        <a href="../index.html#services" class="hover:text-[#851ee8] transition-colors">Services</a>
        <a href="index.html" class="text-[#851ee8]" aria-current="page">Blog</a>
        <a href="../index.html#contact" class="hover:text-[#851ee8] transition-colors">Contact</a>
      </nav>

      <div class="hidden sm:block">
        <a href="../index.html#contact" class="bg-[#851ee8] hover:bg-[#7316cd] active:scale-95 text-white px-7 py-2.5 rounded-full font-extrabold text-sm shadow-md hover:shadow-purple-300 transition duration-200 inline-block">
          Get Started
        </a>
      </div>

      <button onclick="toggleMobileMenu()" aria-label="Toggle Navigation" class="md:hidden text-[#230d4e] p-2 focus:outline-none">
        <i id="mobileMenuIcon" class="fa-solid fa-bars text-2xl"></i>
      </button>
    </div>

    <div id="mobileMenu" class="hidden md:hidden bg-white border-b border-purple-100 px-6 py-5 space-y-4 shadow-lg">
      <a href="../index.html#how-it-works" class="block font-bold text-lg text-[#230d4e] hover:text-[#851ee8]">How It Works</a>
      <a href="../index.html#services" class="block font-bold text-lg text-[#230d4e] hover:text-[#851ee8]">Services</a>
      <a href="index.html" class="block font-bold text-lg text-[#851ee8]">Blog</a>
      <a href="../index.html#contact" class="block font-bold text-lg text-[#230d4e] hover:text-[#851ee8]">Contact</a>
      <a href="../index.html#contact" class="block text-center bg-[#851ee8] text-white py-3 rounded-full font-extrabold text-base shadow-md">
        Get Started
      </a>
    </div>
  </header>

  <main class="flex-grow">

    <!-- Post title band -->
    <section class="bg-[#fdf2ff] border-b border-purple-100 py-12 sm:py-16">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <p class="text-sm font-extrabold uppercase tracking-widest text-[#5a1e96] mb-3">The Hem Works Blog</p>
        <!-- ✏️ POST TITLE -->
        <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-[#230d4e] tracking-tight leading-[1.1] max-w-3xl mx-auto">
          YOUR POST TITLE
        </h1>
      </div>
    </section>

    <!-- Two columns: post (left) + list of posts (right) -->
    <section class="py-12 sm:py-16 bg-white">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-12">

        <!-- ============ LEFT: POST CONTENT ============ -->
        <article class="lg:col-span-8 space-y-6 text-base sm:text-lg font-semibold text-[#3b0764]/80 leading-relaxed">

          <!-- ✏️ Image (optional). Put image files in blog/img/ -->
          <figure class="post-figure rounded-3xl overflow-hidden border border-purple-100 shadow-sm">
            <img src="img/YOUR-IMAGE.webp" alt="Describe the image" loading="lazy">
          </figure>

          <!-- ✏️ Paragraphs: copy/paste as many as you need -->
          <p>Your first paragraph goes here.</p>
          <p>Your second paragraph goes here.</p>

          <!-- ✏️ Optional sub-heading -->
          <h2 class="text-2xl sm:text-3xl font-black text-[#230d4e] tracking-tight">A sub-heading</h2>

          <!-- ✏️ Optional bulleted list -->
          <ul class="space-y-3 text-[#230d4e] font-bold">
            <li class="flex items-start gap-3"><i class="fa-solid fa-heart text-[#851ee8] text-xs mt-2 shrink-0"></i><span>List item</span></li>
            <li class="flex items-start gap-3"><i class="fa-solid fa-heart text-[#851ee8] text-xs mt-2 shrink-0"></i><span>List item</span></li>
          </ul>

          <p class="text-4xl text-[#851ee8]" style="font-family: 'Brush Script MT', cursive; font-style: italic;">
            Sandra <i class="fa-solid fa-heart text-2xl align-middle"></i>
          </p>
        </article>

        <!-- ============ RIGHT: LIST OF POSTS (filled automatically from posts.js) ============ -->
        <aside class="lg:col-span-4">
          <div class="lg:sticky lg:top-28 bg-[#faf6fe] border border-purple-100 rounded-3xl p-6 sm:p-7 shadow-sm">
            <h2 class="text-xl sm:text-2xl font-black text-[#230d4e] tracking-tight mb-2">All Posts</h2>
            <div class="flex items-center gap-2 mb-4 max-w-[120px]">
              <div class="flex-1 h-[1.5px] bg-[#e9d5ff]"></div>
              <i class="fa-solid fa-heart text-[#851ee8] text-xs"></i>
              <div class="flex-1 h-[1.5px] bg-[#e9d5ff]"></div>
            </div>
            <ul id="post-list" class="space-y-1"></ul>
          </div>
        </aside>

      </div>
    </section>
  </main>

  <footer class="bg-[#851ee8] text-white py-4 px-4 text-center text-xs sm:text-sm font-bold tracking-wide">
    <p>© 2026 Hem Works LLC</p>
  </footer>

  <script src="posts.js"></script>
  <script>
    function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      const icon = document.getElementById('mobileMenuIcon');
      menu.classList.toggle('hidden');
      icon.className = menu.classList.contains('hidden')
        ? 'fa-solid fa-bars text-2xl'
        : 'fa-solid fa-xmark text-2xl';
    }
  </script>
</body>
</html>
